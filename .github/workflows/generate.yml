name: Reggae Music Factory

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and upload private YouTube video
        env:
          TREBLO_API_KEY: ${{ secrets.TREBLO_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python factory.py
